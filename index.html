<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday Bro</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(circle at 20% 20%, #ffd6e7 0%, transparent 30%),
                radial-gradient(circle at 80% 80%, #d6e4ff 0%, transparent 30%),
                linear-gradient(135deg, #fff1f7, #e8f0ff);

            color: #252525;
        }

        /* Floating background balloons */

        .balloon {
            position: absolute;
            width: 70px;
            height: 85px;
            border-radius: 50%;
            opacity: 0.65;

            animation: float 5s ease-in-out infinite;
        }

        .balloon::after {
            content: "";
            position: absolute;
            width: 1px;
            height: 100px;
            background: #555;
            top: 82px;
            left: 50%;
        }

        .balloon.one {
            background: #ff8fab;
            top: 8%;
            left: 8%;
        }

        .balloon.two {
            background: #8ecae6;
            top: 15%;
            right: 8%;
            animation-delay: 1s;
        }

        .balloon.three {
            background: #ffd166;
            bottom: 12%;
            left: 12%;
            animation-delay: 2s;
        }

        .balloon.four {
            background: #b8e0d2;
            bottom: 8%;
            right: 12%;
            animation-delay: 0.5s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(-3deg);
            }

            50% {
                transform: translateY(-20px) rotate(3deg);
            }
        }

        /* Main birthday card */

        .card {
            position: relative;
            z-index: 2;

            width: min(90%, 600px);
            padding: 55px 35px;

            text-align: center;

            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 30px;

            box-shadow:
                0 25px 60px rgba(80, 80, 120, 0.18);

            animation: appear 1s ease forwards;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Birthday cake */

        .cake {
            width: 90px;
            height: 60px;
            margin: 0 auto 30px;

            position: relative;

            background: linear-gradient(
                to bottom,
                #f8b4c8 0%,
                #f8b4c8 50%,
                #e98aa8 50%,
                #e98aa8 100%
            );

            border-radius: 8px 8px 12px 12px;

            box-shadow:
                inset 0 -6px 0 rgba(0, 0, 0, 0.08),
                0 8px 15px rgba(0, 0, 0, 0.1);

            animation: cakeBounce 2s ease-in-out infinite;
        }

        .cake::before {
            content: "";
            position: absolute;

            width: 100px;
            height: 12px;

            left: -5px;
            top: -8px;

            background: #fff;
            border-radius: 10px;
        }

        .cake::after {
            content: "";

            position: absolute;

            width: 4px;
            height: 25px;

            background: #555;

            left: 43px;
            top: -32px;

            box-shadow: 15px 0 #555;
        }

        @keyframes cakeBounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        /* Heading */

        h1 {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 800;

            background: linear-gradient(
                90deg,
                #ff4f81,
                #ff7b54,
                #ff4f81
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            margin-bottom: 15px;
        }

        .subtitle {
            font-size: 1.3rem;
            color: #555;
            margin-bottom: 25px;
        }

        .message {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #666;

            max-width: 450px;
            margin: auto;
        }

        /* Decorative stars */

        .stars {
            margin-top: 30px;
            font-size: 1.5rem;
            letter-spacing: 10px;

            color: #ff7b54;

            animation: sparkle 2s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%, 100% {
                opacity: 0.5;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.1);
            }
        }

        .footer {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #999;
        }

        /* Confetti */

        .confetti {
            position: absolute;

            width: 8px;
            height: 14px;

            top: -20px;

            border-radius: 2px;

            animation: fall linear infinite;
        }

        .confetti:nth-of-type(5n) {
            background: #ff8fab;
        }

        .confetti:nth-of-type(5n + 1) {
            background: #8ecae6;
        }

        .confetti:nth-of-type(5n + 2) {
            background: #ffd166;
        }

        .confetti:nth-of-type(5n + 3) {
            background: #b8e0d2;
        }

        .confetti:nth-of-type(5n + 4) {
            background: #cdb4db;
        }

        @keyframes fall {
            from {
                transform: translateY(-20px) rotate(0deg);
            }

            to {
                transform: translateY(110vh) rotate(720deg);
            }
        }

        /* Mobile */

        @media (max-width: 600px) {

            .card {
                padding: 45px 25px;
            }

            .balloon {
                transform: scale(0.7);
            }

            .message {
                font-size: 1rem;
            }

            h1 {
                font-size: 2.8rem;
            }
        }
    </style>
</head>

<body>

    <!-- Background balloons -->

    <div class="balloon one"></div>
    <div class="balloon two"></div>
    <div class="balloon three"></div>
    <div class="balloon four"></div>


    <!-- Falling confetti -->

    <div class="confetti"
         style="left: 5%; animation-duration: 6s; animation-delay: 0s;"></div>

    <div class="confetti"
         style="left: 20%; animation-duration: 8s; animation-delay: 2s;"></div>

    <div class="confetti"
         style="left: 35%; animation-duration: 7s; animation-delay: 1s;"></div>

    <div class="confetti"
         style="left: 50%; animation-duration: 9s; animation-delay: 3s;"></div>

    <div class="confetti"
         style="left: 65%; animation-duration: 6s; animation-delay: 1s;"></div>

    <div class="confetti"
         style="left: 80%; animation-duration: 8s; animation-delay: 4s;"></div>

    <div class="confetti"
         style="left: 95%; animation-duration: 7s; animation-delay: 2s;"></div>


    <!-- Main birthday card -->

    <main class="card">

        <div class="cake"></div>

        <h1>
            Happy Birthday Bro!
        </h1>

        <p class="subtitle">
            Hope you have an amazing day!
        </p>

        </p>

        <div class="stars">
            * * *
        </div>

        <div class="footer">
            
        </div>

    </main>

</body>
</html>
